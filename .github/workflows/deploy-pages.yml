name: Deploy static preview to GitHub Pages

# Publishes only `site-preview/` — a static screenshot walkthrough of Mero.
# Mero itself is a full Next.js server app (auth, database, API routes) and
# cannot run on GitHub Pages; see site-preview/index.html for why.

on:
  push:
    branches:
      - claude/wizardly-noether-ydvfj2
    paths:
      - "site-preview/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-preview
      - id: deployment
        uses: actions/deploy-pages@v4
